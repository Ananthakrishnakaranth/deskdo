name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskdo
          POSTGRES_PASSWORD: deskdo
          POSTGRES_DB: deskdo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskdo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      E2E_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deskdo/mobile build && pnpm --filter @deskdo/server build
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) pnpm e2e

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deskdo/desktop test
      # electron-builder downloads its NSIS/winCodeSign helpers from GitHub releases; keep them cached
      # so a GitHub download outage doesn't block every build.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-cache-${{ runner.os }}-26.18.0
      # Retry the installer a few times; if GitHub still won't serve the NSIS helper files (it answered
      # 504 for one of them for hours), ship a portable zip instead, which doesn't need NSIS.
      - name: Build installer (or portable zip)
        shell: bash
        working-directory: packages/desktop
        run: |
          for wait in 0 30 90; do
            sleep "$wait"
            pnpm dist:win && exit 0
          done
          echo "::warning::NSIS helpers unavailable from GitHub; building a portable zip instead"
          # Skip the exe-resource edit too (it needs the winCodeSign download); the app is unchanged.
          npx electron-builder --win zip --x64 --publish never -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Setup
          if-no-files-found: error
          path: |
            packages/desktop/release/DeskDo-Setup-*.exe
            packages/desktop/release/*.zip

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      # A stable signing key (stored as repo secrets) lets each new APK install over the old one.
      # Without the secrets the APK is signed with a throwaway debug key instead.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; APK will be debug-signed"
          fi
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeskDo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Android
          path: packages/android/app/build/outputs/apk/release/DeskDo.apk

  # Runs the real Android app and its home-screen widget on an emulator, against a real server and
  # database started on this machine. The widget is placed on a test home screen and driven through
  # the same RemoteViews and PendingIntents a launcher uses. Screenshots go to the "ci-debug" release.
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskdo
          POSTGRES_PASSWORD: deskdo
          POSTGRES_DB: deskdo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskdo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SERVER_PORT: "18080"
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-password-123
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Build server and web app
        run: |
          pnpm install --frozen-lockfile --filter @deskdo/server... --filter @deskdo/mobile...
          pnpm --filter @deskdo/mobile build
          pnpm --filter @deskdo/server build
      - name: Start server
        run: |
          HASH=$(cd packages/server && node -e "console.log(require('bcryptjs').hashSync(process.env.E2E_PASSWORD, 4))")
          DATABASE_URL=postgres://deskdo:deskdo@localhost:5432/deskdo_test DATABASE_SSL=false \
          ACCOUNT_EMAIL="$E2E_EMAIL" ACCOUNT_PASSWORD_HASH="$HASH" JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
          PORT="$SERVER_PORT" STATIC_DIR=packages/mobile/dist COOKIE_SECURE=false KEEPALIVE_HOURS=off \
          nohup node packages/server/dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS "http://localhost:$SERVER_PORT/healthz" && break; sleep 1; done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build debug app and tests
        working-directory: packages/android
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app and widget on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33 # Android 13, the version on the phone this app is used on
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          cores: 3
          disable-animations: true
          script: bash packages/android/ci/emulator-test.sh
      - name: Server log
        if: always()
        run: tail -n 80 server.log || true
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls packages/android/ci-out/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          gh release view ci-debug >/dev/null 2>&1 || gh release create ci-debug --prerelease \
            --title "CI debug output" --notes "Screenshots from the Android emulator tests. Not a download for users."
          gh release upload ci-debug packages/android/ci-out/*.png --clobber

  # Publishes the newest builds at fixed URLs (handy on a phone):
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo.apk
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo-Setup.exe
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-installer, android-apk, android-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(dist/DeskDo-Android/DeskDo.apk)
          notes="Built from ${GITHUB_SHA::7}. Android: install DeskDo.apk."
          if ls dist/DeskDo-Setup/DeskDo-Setup-*.exe >/dev/null 2>&1; then
            mv dist/DeskDo-Setup/DeskDo-Setup-*.exe dist/DeskDo-Setup.exe
            files+=(dist/DeskDo-Setup.exe)
            notes="$notes Windows: run DeskDo-Setup.exe."
          fi
          if ls dist/DeskDo-Setup/*.zip >/dev/null 2>&1; then
            mv dist/DeskDo-Setup/*.zip dist/DeskDo-Windows.zip
            files+=(dist/DeskDo-Windows.zip)
            notes="$notes Windows (portable): unzip DeskDo-Windows.zip and run DeskDo.exe."
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${files[@]}" --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
