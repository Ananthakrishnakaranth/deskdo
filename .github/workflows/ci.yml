name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskdo
          POSTGRES_PASSWORD: deskdo
          POSTGRES_DB: deskdo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskdo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      E2E_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deskdo/mobile build && pnpm --filter @deskdo/server build
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) pnpm e2e

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deskdo/desktop test
      - run: pnpm dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Setup
          path: packages/desktop/release/DeskDo-Setup-*.exe

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      # A stable signing key (stored as repo secrets) lets each new APK install over the old one.
      # Without the secrets the APK is signed with a throwaway debug key instead.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; APK will be debug-signed"
          fi
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeskDo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Android
          path: packages/android/app/build/outputs/apk/release/DeskDo.apk

  # Publishes the newest builds at fixed URLs (handy on a phone):
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo.apk
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo-Setup.exe
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-installer, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv dist/DeskDo-Setup/DeskDo-Setup-*.exe dist/DeskDo-Setup.exe
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/DeskDo-Android/DeskDo.apk dist/DeskDo-Setup.exe \
            --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Android: install DeskDo.apk. Windows: run DeskDo-Setup.exe."
