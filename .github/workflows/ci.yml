name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: deskdo
          POSTGRES_PASSWORD: deskdo
          POSTGRES_DB: deskdo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deskdo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      E2E_DATABASE_URL: postgres://deskdo:deskdo@localhost:5432/deskdo_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @deskdo/mobile build && pnpm --filter @deskdo/server build
      - run: npm i -g playwright@1 && npx playwright install --with-deps chromium
      - run: NODE_PATH=$(npm root -g) pnpm e2e

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deskdo/desktop test
      # electron-builder downloads its NSIS/winCodeSign helpers from GitHub releases; keep them cached
      # so a GitHub download outage doesn't block every build.
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron-builder/Cache
          key: electron-builder-cache-${{ runner.os }}-26.18.0
      # Retry the installer a few times; if GitHub still won't serve the NSIS helper files (it answered
      # 504 for one of them for hours), ship a portable zip instead, which doesn't need NSIS.
      - name: Build installer (or portable zip)
        shell: bash
        working-directory: packages/desktop
        run: |
          for wait in 0 30 90; do
            sleep "$wait"
            pnpm dist:win && exit 0
          done
          echo "::warning::NSIS helpers unavailable from GitHub; building a portable zip instead"
          # Skip the exe-resource edit too (it needs the winCodeSign download); the app is unchanged.
          npx electron-builder --win zip --x64 --publish never -c.win.signAndEditExecutable=false
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Setup
          if-no-files-found: error
          path: |
            packages/desktop/release/DeskDo-Setup-*.exe
            packages/desktop/release/*.zip

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      # A stable signing key (stored as repo secrets) lets each new APK install over the old one.
      # Without the secrets the APK is signed with a throwaway debug key instead.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 not set; APK will be debug-signed"
          fi
      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DeskDo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DeskDo-Android
          path: packages/android/app/build/outputs/apk/release/DeskDo.apk

  # Publishes the newest builds at fixed URLs (handy on a phone):
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo.apk
  #   https://github.com/<owner>/<repo>/releases/download/latest/DeskDo-Setup.exe
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows-installer, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=(dist/DeskDo-Android/DeskDo.apk)
          notes="Built from ${GITHUB_SHA::7}. Android: install DeskDo.apk."
          if ls dist/DeskDo-Setup/DeskDo-Setup-*.exe >/dev/null 2>&1; then
            mv dist/DeskDo-Setup/DeskDo-Setup-*.exe dist/DeskDo-Setup.exe
            files+=(dist/DeskDo-Setup.exe)
            notes="$notes Windows: run DeskDo-Setup.exe."
          fi
          if ls dist/DeskDo-Setup/*.zip >/dev/null 2>&1; then
            mv dist/DeskDo-Setup/*.zip dist/DeskDo-Windows.zip
            files+=(dist/DeskDo-Windows.zip)
            notes="$notes Windows (portable): unzip DeskDo-Windows.zip and run DeskDo.exe."
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${files[@]}" --target "$GITHUB_SHA" --title "Latest build" --notes "$notes"
