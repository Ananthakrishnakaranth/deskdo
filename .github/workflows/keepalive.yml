name: Keep server awake

# Render's free web services sleep after 15 minutes without traffic and then take up to a minute to
# wake, which shows up as a blank or "connecting" app. Pinging the health endpoint regularly keeps
# the one service awake (it fits in the free tier's 750 instance-hours a month). GitHub may run
# scheduled jobs a few minutes late, hence every 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 100 --retry 2 --retry-delay 5 https://deskdo.onrender.com/healthz
