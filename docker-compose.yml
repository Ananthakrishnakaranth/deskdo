# Local Postgres for development and tests (Docker Desktop on Windows):  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deskdo
      POSTGRES_PASSWORD: deskdo
      POSTGRES_DB: deskdo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
